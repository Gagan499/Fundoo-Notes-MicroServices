spring:
  config:
    import: optional:file:./.env[.properties]
  application:
    name: NotificationService
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${NOTIFICATION_KAFKA_GROUP_ID:notification-service}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:false}
server:
  port: ${NOTIFICATION_SERVER_PORT:8084}
notification:
  kafka:
    topic: ${NOTIFICATION_KAFKA_TOPIC:note-reminder}
  mail:
    from: ${NOTIFICATION_MAIL_FROM:no-reply@fundoo.local}
