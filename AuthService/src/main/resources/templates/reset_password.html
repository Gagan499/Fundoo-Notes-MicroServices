<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset password</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            align-items: center;
            background: #f3f5f9;
            color: #202636;
            display: flex;
            font-family: Arial, sans-serif;
            justify-content: center;
            margin: 0;
            min-height: 100vh;
            padding: 24px;
        }

        main {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 12px 36px rgba(32, 38, 54, .1);
            max-width: 420px;
            padding: 36px;
            width: 100%;
        }

        h1 {
            font-size: 1.7rem;
            margin: 0 0 12px;
        }

        p {
            color: #596275;
            line-height: 1.5;
        }

        label {
            display: block;
            font-weight: 600;
            margin: 20px 0 8px;
        }

        input {
            border: 1px solid #c9cfda;
            border-radius: 6px;
            font: inherit;
            padding: 12px;
            width: 100%;
        }

        button {
            background: #3157d5;
            border: 0;
            border-radius: 6px;
            color: #fff;
            cursor: pointer;
            font: inherit;
            font-weight: 600;
            margin-top: 22px;
            padding: 12px;
            width: 100%;
        }

        .message {
            background: #eef7f0;
            border-radius: 6px;
            color: #245c35;
            padding: 12px;
        }

        .error {
            color: #b42318;
            font-size: .9rem;
            margin-top: 6px;
        }
    </style>
</head>
<body>
<main>
    <h1>Choose a new password</h1>
    <p>Use at least 8 characters for your new password.</p>

    <p class="message" role="status" th:if="${success}">
        Your password has been reset. You can now sign in with your new password.
    </p>
    <p class="error" role="alert" th:if="${error}" th:text="${error}"></p>

    <form th:unless="${success}" th:action="@{/reset-password}" th:object="${request}" method="post">
        <input type="hidden" name="token" th:value="${token}">

        <label for="newPassword">New password</label>
        <input id="newPassword" type="password" th:field="*{newPassword}" autocomplete="new-password"
               minlength="8" required>
        <div class="error" role="alert" th:if="${#fields.hasErrors('newPassword')}"
             th:errors="*{newPassword}"></div>

        <label for="confirmPassword">Confirm new password</label>
        <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password"
               minlength="8" required>

        <button type="submit">Reset password</button>
    </form>
</main>
</body>
</html>
