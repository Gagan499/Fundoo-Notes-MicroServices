<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forgot password</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            align-items: center;
            background: #f3f5f9;
            color: #202636;
            display: flex;
            font-family: Arial, sans-serif;
            justify-content: center;
            margin: 0;
            min-height: 100vh;
            padding: 24px;
        }

        main {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 12px 36px rgba(32, 38, 54, .1);
            max-width: 420px;
            padding: 36px;
            width: 100%;
        }

        h1 {
            font-size: 1.7rem;
            margin: 0 0 12px;
        }

        p {
            color: #596275;
            line-height: 1.5;
        }

        label {
            display: block;
            font-weight: 600;
            margin: 24px 0 8px;
        }

        input {
            border: 1px solid #c9cfda;
            border-radius: 6px;
            font: inherit;
            padding: 12px;
            width: 100%;
        }

        button {
            background: #3157d5;
            border: 0;
            border-radius: 6px;
            color: #fff;
            cursor: pointer;
            font: inherit;
            font-weight: 600;
            margin-top: 18px;
            padding: 12px;
            width: 100%;
        }

        .message {
            background: #eef7f0;
            border-radius: 6px;
            color: #245c35;
            padding: 12px;
        }

        .error {
            color: #b42318;
            font-size: .9rem;
            margin-top: 6px;
        }
    </style>
</head>
<body>
<main>
    <h1>Forgot your password?</h1>
    <p>Enter the email address associated with your account. If it exists, we’ll send you a reset link.</p>

    <p class="message" role="status" th:if="${message}" th:text="${message}"></p>

    <form th:action="@{/forgot-password}" th:object="${request}" method="post">
        <label for="email">Email address</label>
        <input id="email" type="email" th:field="*{email}" autocomplete="email" required>
        <div class="error" role="alert" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        <button type="submit">Send reset link</button>
    </form>
</main>
</body>
</html>
