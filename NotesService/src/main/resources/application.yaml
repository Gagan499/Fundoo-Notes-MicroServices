spring:
  config:
    import: optional:file:./.env[.properties]
  application:
    name: NotesService
  datasource:
    url: ${NOTES_DB_URL:jdbc:mysql://localhost:3306/fundoo_notes_db}
    username: ${NOTES_DB_USERNAME:root}
    password: ${NOTES_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${NOTES_JPA_DDL_AUTO:update}
    show-sql: ${NOTES_JPA_SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  cache:
    type: redis
  data:
    redis:
      host: ${NOTES_REDIS_HOST:localhost}
      port: ${NOTES_REDIS_PORT:6379}
      password: ${NOTES_REDIS_PASSWORD:}
server:
  port: ${NOTES_SERVER_PORT:8081}
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}
